name = "storybook-wonder-api"
main = "src/index.ts"
compatibility_date = "2024-01-15"
compatibility_flags = ["nodejs_compat"]

# D1 Database binding
[[d1_databases]]
binding = "DB"
database_name = "storybook-wonder"
database_id = "YOUR_D1_DATABASE_ID"

# Environment variables
[vars]
ENVIRONMENT = "production"
# JWT_SECRET and BREVO_API_KEY are secrets: `wrangler secret put <NAME>` (local: worker/.dev.vars)
JWT_EXPIRES_IN = "7d"

# Brevo
BREVO_LIST_ID = "6"

# CORS allowed origins (comma-separated)
ALLOWED_ORIGINS = "https://storybook-wonder.pages.dev,https://sterrenverhalen.nl,https://www.sterrenverhalen.nl"

# Rate limiting
RATE_LIMIT_REQUESTS = "100"
RATE_LIMIT_WINDOW = "60"

# Development environment
[env.dev]
vars = { ENVIRONMENT = "development" }

[env.dev.d1_databases]
binding = "DB"
database_name = "storybook-wonder"
database_id = "YOUR_D1_DATABASE_ID"

